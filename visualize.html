<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hidden-Focus Thermodynamic Visualizer</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { margin: 0; background: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', monospace; overflow: hidden; }
        svg { width: 100vw; height: 100vh; cursor: crosshair; }
        #ui-layer {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 1000px; background: rgba(22, 27, 34, 0.95);
            padding: 20px; border-radius: 12px; border: 1px solid #30363d;
            backdrop-filter: blur(10px); z-index: 10; pointer-events: auto;
        }
        .slider-row { display: flex; align-items: center; gap: 15px; margin-top: 10px; }
        .label { width: 140px; font-size: 10px; color: #8b949e; letter-spacing: 1px; }
        input[type=range] { flex-grow: 1; accent-color: #ff4444; }
        .stats { display: flex; justify-content: space-between; font-size: 14px; font-family: monospace; }
        #status { font-size: 10px; font-weight: bold; }
        .node-label { fill: #ffffff; font-size: 8px; font-weight: bold; pointer-events: none; text-anchor: middle; font-family: sans-serif; }
        .link { stroke: #ffffff; stroke-opacity: 0.1; stroke-width: 1.5px; }
        #hint { position: absolute; top: 10px; left: 10px; font-size: 10px; color: #8b949e; }
    </style>
</head>
<body>

<div id="hint">MOUSEWHEEL: Camera Zoom | DRAG: Pan | DB-CLICK: Center on Hidden</div>

<div id="ui-layer">
    <div class="stats">
        <div>BATCH <span id="batch-val" style="color:#58a6ff">--</span> | <span id="status">● WAITING</span></div>
        <div>SUBSTEP <span id="step-val" style="color:#ff7b72">--</span></div>
        <div style="color: #3fb950;">ACC: <span id="acc-val">--</span>%</div>
    </div>
    <div class="slider-row">
        <div class="label">BATCH</div>
        <input type="range" id="batch-scrubber" value="0" min="0" max="0">
    </div>
    <div class="slider-row">
        <div class="label">SUBSTEP</div>
        <input type="range" id="step-scrubber" value="0" min="0" max="49">
    </div>
</div>

<script>
    let metaIndex = [], currentBatchData = [], currentBatchIdx = 0, currentStepIdx = 0, isManual = false;
    let transform = d3.zoomIdentity;

    const svg = d3.select("body").append("svg");
    const gLinks = svg.append("g");
    const gNodes = svg.append("g");

    // D3 Zoom implementation
    const zoom = d3.zoom()
        .scaleExtent([0.05, 50])
        .on("zoom", (event) => {
            transform = event.transform;
            render(); // Re-render with new camera transform
        });

    svg.call(zoom);

    const colorScale = d3.scaleSequential(d3.interpolateRgb("#ffffff", "#ff0000"));
    const xScale = d3.scaleLinear(), yScale = d3.scaleLinear();

    async function pollMeta() {
        try {
            const res = await fetch('telemetry/meta.json', { cache: "no-store" });
            metaIndex = await res.json();
            document.getElementById('batch-scrubber').max = metaIndex.length - 1;
            if (!isManual && metaIndex.length > 0) {
                currentBatchIdx = metaIndex.length - 1;
                document.getElementById('batch-scrubber').value = currentBatchIdx;
                await loadSpecificBatch(currentBatchIdx);
            }
            document.getElementById('status').innerText = "● LIVE";
            document.getElementById('status').style.color = "#238636";
        } catch (err) { document.getElementById('status').innerText = "○ OFFLINE"; }
    }

    async function loadSpecificBatch(idx) {
        if (!metaIndex[idx]) return;
        try {
            const res = await fetch(`telemetry/${metaIndex[idx]}`, { cache: "force-cache" });
            currentBatchData = await res.json();
            document.getElementById('step-scrubber').max = currentBatchData.length - 1;
            render();
        } catch (err) {}
    }

    function render() {
        if (currentBatchData.length === 0) return;
        const frame = currentBatchData[Math.min(currentStepIdx, currentBatchData.length - 1)];
        if (!frame) return;

        const nodes = frame.coords;
        const losses = frame.node_surprises;
        const width = window.innerWidth, height = window.innerHeight;

        // THE FIX: Only use Hidden Nodes (index 20-74) for scaling
        const hiddenNodes = nodes.slice(20);
        const xExt = d3.extent(hiddenNodes, d => d[2]);
        const yExt = d3.extent(hiddenNodes, d => d[1]);

        // Map Hidden Bounding Box to Screen
        xScale.domain(xExt).range([150, width - 150]);
        yScale.domain(yExt).range([height - 150, 150]);

        // Apply Camera Transform
        const tx = (d) => transform.applyX(xScale(d[2]));
        const ty = (d) => transform.applyY(yScale(d[1]));

        document.getElementById('batch-val').innerText = frame.batch;
        document.getElementById('step-val').innerText = frame.substep;
        document.getElementById('acc-val').innerText = frame.accuracy;
        colorScale.domain([0, Math.max(d3.max(losses), 0.2)]);

        // Render Links
        const links = [];
        for(let i=0; i<nodes.length; i++) {
            for(let j=i+1; j<nodes.length; j++) {
                if(frame.adjacency[i][j]) links.push({s: nodes[i], t: nodes[j]});
            }
        }
        
        const l = gLinks.selectAll(".link").data(links);
        l.exit().remove();
        l.enter().append("line").attr("class", "link").merge(l)
            .attr("x1", d => tx(d.s)).attr("y1", d => ty(d.s))
            .attr("x2", d => tx(d.t)).attr("y2", d => ty(d.t));

        // Render Nodes (Fixed size circle regardless of zoom)
        const n = gNodes.selectAll(".node-group").data(nodes);
        n.exit().remove();
        const enter = n.enter().append("g").attr("class", "node-group");
        enter.append("circle").attr("r", 7).style("stroke", "#0d1117").style("stroke-width", 1);
        enter.append("text").attr("class", "node-label").attr("dy", 3);
        
        const g = enter.merge(n).attr("transform", d => `translate(${tx(d)},${ty(d)})`);
        g.select("circle").attr("fill", (d, i) => i < 10 ? "#ff8c00" : i < 20 ? "#1e90ff" : colorScale(losses[i]));
        g.select("text").text((d, i) => losses[i] > 0.05 ? losses[i].toFixed(2) : "");
    }

    document.getElementById('batch-scrubber').oninput = async function() {
        isManual = true; currentBatchIdx = +this.value; currentStepIdx = 0;
        await loadSpecificBatch(currentBatchIdx);
    };

    document.getElementById('step-scrubber').oninput = function() {
        isManual = true; currentStepIdx = +this.value; render();
    };

    setInterval(pollMeta, 2000);
    window.onresize = render;
    pollMeta();
</script>
</body>
</html>
